name: CI/CD Pipeline - ShopNow Microservices

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # STAGE 1: LINT & VALIDATE
  # ============================================================================
  validate:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          echo "Validating docker-compose.yml..."
          docker-compose config -q && echo "✓ docker-compose.yml is valid"

      - name: Validate Dockerfiles
        run: |
          for dockerfile in serv_*/Dockerfile; do
            echo "Checking $dockerfile..."
            if grep -q "EXPOSE\|CMD" "$dockerfile"; then
              echo "✓ $dockerfile is valid"
            else
              echo "✗ $dockerfile is missing EXPOSE or CMD"
              exit 1
            fi
          done

      - name: Lint Python Files
        uses: psf/black@stable
        with:
          options: "--check --verbose"
          src: "./serv_clientes ./serv_productos ./serv_pedidos ./serv_inventario"
          jupyter: false

      - name: Validate YAML Files
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
              indentation:
                spaces: 2

  # ============================================================================
  # STAGE 2: BUILD DOCKER IMAGES
  # ============================================================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - clientes
          - productos
          - pedidos
          - inventario
          - productos-php

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.service }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/shopnow-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=${{ github.run_number }}

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: ./serv_${{ matrix.service }}
          file: ./serv_${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/shopnow-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/shopnow-${{ matrix.service }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build summary for ${{ matrix.service }}
        run: |
          echo "### ✓ ${{ matrix.service }} Image Built" >> $GITHUB_STEP_SUMMARY
          echo "- Registry: ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # STAGE 3: UNIT TESTS
  # ============================================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r serv_clientes/requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term tests/ || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # ============================================================================
  # STAGE 4: INTEGRATION TESTS
  # ============================================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      rabbitmq:
        image: rabbitmq:3.12-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          for dir in serv_*/; do
            pip install -r "$dir/requirements.txt" --quiet
          done

      - name: Start services with docker-compose
        run: docker-compose up -d --wait

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to start..."
          sleep 10
          docker-compose ps

      - name: Test RabbitMQ connectivity
        run: |
          echo "Testing RabbitMQ connectivity..."
          python -c "
          import pika
          from pika import PlainCredentials
          credentials = PlainCredentials('guest', 'guest')
          from pika import ConnectionParameters
          params = ConnectionParameters('localhost', 5672, credentials=credentials)
          connection = pika.BlockingConnection(params)
          channel = connection.channel()
          print('✓ RabbitMQ connection successful')
          channel.exchange_declare(exchange='servicios', exchange_type='direct', durable=True)
          print('✓ Exchange declared successfully')
          connection.close()
          "

      - name: Test API endpoints
        run: |
          echo "Testing API endpoints..."
          for port in 8000 8001 8002 8003; do
            echo "Testing port $port..."
            response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$port/docs || echo "000")
            if [ "$response" = "200" ]; then
              echo "✓ Service on port $port is responding"
            else
              echo "⚠ Service on port $port returned $response"
            fi
          done

      - name: Test inter-service communication
        run: |
          echo "Testing inter-service communication..."
          docker-compose exec -T clientes ping -c 1 rabbitmq
          docker-compose exec -T productos ping -c 1 rabbitmq
          docker-compose exec -T pedidos ping -c 1 rabbitmq
          docker-compose exec -T inventario ping -c 1 rabbitmq

      - name: Collect service logs
        if: always()
        run: |
          echo "=== Service Logs ===" >> $GITHUB_STEP_SUMMARY
          docker-compose logs

      - name: Cleanup
        if: always()
        run: docker-compose down -v

  # ============================================================================
  # STAGE 5: SECURITY SCANNING
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check Python dependencies for vulnerabilities
        run: |
          pip install safety
          for dir in serv_*/; do
            echo "Scanning $dir dependencies..."
            safety check -r "$dir/requirements.txt" || true
          done

      - name: Scan for hardcoded secrets
        uses: truffleHQ/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --json

  # ============================================================================
  # STAGE 6: DEPLOY TO RAILWAY (only on main branch)
  # ============================================================================
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [build, test, integration, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway login --token "$RAILWAY_TOKEN"
          railway deploy --service clientes
          railway deploy --service productos
          railway deploy --service pedidos
          railway deploy --service inventario
          railway deploy --service rabbitmq
          echo "### 🚀 Deployment to Railway Complete" >> $GITHUB_STEP_SUMMARY
          echo "- All services deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Check Railway Dashboard for status" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # STAGE 7: HEALTH CHECK POST-DEPLOYMENT
  # ============================================================================
  health-check:
    name: Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for deployment
        run: sleep 30

      - name: Check service health
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Checking service health..."
          # Note: Replace with actual Railway deployment URLs
          # Example: https://clientes-abc123.railway.app:8000/docs
          echo "Manual verification needed in Railway Dashboard"
          echo "Check: https://railway.app/dashboard"

      - name: Create deployment summary
        run: |
          echo "### ✓ Deployment Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pipeline Stages:**" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Validate Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Build Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Security Scanning" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Deploy to Railway" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Visit Railway Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify all services are running" >> $GITHUB_STEP_SUMMARY
          echo "3. Access API endpoints via public URLs" >> $GITHUB_STEP_SUMMARY
          echo "4. Test inter-service communication" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # NOTIFICATIONS
  # ============================================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [validate, build, test, integration, security]
    if: always()

    steps:
      - name: Determine job status
        id: status
        run: |
          if [ "${{ needs.validate.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "failure" ] || \
             [ "${{ needs.test.result }}" = "failure" ] || \
             [ "${{ needs.integration.result }}" = "failure" ] || \
             [ "${{ needs.security.result }}" = "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Notification - Success
        if: steps.status.outputs.status == 'success'
        run: |
          echo "### ✓ CI/CD Pipeline Successful" >> $GITHUB_STEP_SUMMARY
          echo "All checks passed! Ready for deployment." >> $GITHUB_STEP_SUMMARY

      - name: Notification - Failure
        if: steps.status.outputs.status == 'failure'
        run: |
          echo "### ✗ CI/CD Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for errors." >> $GITHUB_STEP_SUMMARY
          exit 1
